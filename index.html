<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card | Naoki</title>
    <!-- Social Media Icon များအတွက် Font Awesome ကိုချိတ်ဆက်ထားခြင်း -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float-reverse 25s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(20px); }
        }
        
        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(30px) translateX(-20px); }
        }
        
        .card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 
                0 20px 60px rgba(59, 130, 246, 0.12),
                0 0 1px rgba(59, 130, 246, 0.1);
            text-align: center;
            margin: 20px;
            border: 1px solid rgba(59, 130, 246, 0.08);
            position: relative;
            z-index: 1;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Card background pattern */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .card-content {
            position: relative;
            z-index: 2;
        }
        
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            object-fit: cover;
            border: 4px solid #ffffff;
            margin: 0 auto 25px;
            box-shadow: 
                0 15px 40px rgba(59, 130, 246, 0.2),
                0 0 0 1px rgba(59, 130, 246, 0.1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: block;
        }
        
        .profile-img:hover {
            transform: scale(1.08) rotateZ(2deg);
            box-shadow: 
                0 25px 50px rgba(59, 130, 246, 0.3),
                0 0 0 1px rgba(59, 130, 246, 0.15);
        }
        
        .name {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        
        .title {
            font-size: 15px;
            color: #3b82f6;
            margin-bottom: 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #e0e7ff 20%, #e0e7ff 80%, transparent);
            margin: 28px 0;
            border-radius: 1px;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid transparent;
            background: rgba(59, 130, 246, 0.02);
        }
        
        .contact-item:hover {
            color: #1e40af;
            border: 1.5px solid rgba(59, 130, 246, 0.2);
            background: rgba(59, 130, 246, 0.08);
            transform: translateX(4px);
        }
        
        .contact-item i {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        
        .social-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e0e7ff 100%);
            color: #475569;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 18px;
            border: 1.5px solid rgba(59, 130, 246, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: left 0.3s ease;
            z-index: -1;
        }
        
        .social-btn:hover {
            color: #ffffff;
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(59, 130, 246, 0.25);
            border: 1.5px solid #3b82f6;
        }
        
        .social-btn:hover::before {
            left: 0;
        }
        
        .website-link {
            display: inline-block;
            margin-top: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 2px solid transparent;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
        }
        
        .website-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: left 0.3s ease;
            z-index: -1;
        }
        
        .website-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .website-link:hover::before {
            left: 0;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 40px 28px;
                max-width: 100%;
                border-radius: 20px;
            }
            
            .name {
                font-size: 24px;
            }
            
            .profile-img {
                width: 130px;
                height: 130px;
                margin-bottom: 20px;
            }
            
            .contact-item {
                font-size: 13px;
                padding: 10px 14px;
            }
            
            .social-btn {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-content">
            <!-- Profile Picture -->
            <img src="/manus-storage/profile_fd8adf86.png" alt="Naoki Profile" class="profile-img">
            
            <!-- Name and Title -->
            <h1 class="name">Thet Htoo Swe</h1>

            <div class="divider"></div>
            
            <!-- Contact Information -->
            <div class="contact-info">
                <a href="mailto:naokikun.ygn@gmail.com" class="contact-item">

                </a>
                <a href="tel:+959755170040" class="contact-item">
                    <i class="fas fa-phone-alt"></i> +95 9755170040

            <!-- Social Media Links -->
            <div class="social-links">

            <!-- Website Link Button -->
            <a href="https://naokikun.github.io" target="_blank" class="website-link">
                Visit Website
            </a>
        </div>
    </div>

</body>
</html>
