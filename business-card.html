<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card | Naoki</title>
    <!-- Social Media Icon များအတွက် Font Awesome ကိုချိတ်ဆက်ထားခြင်း -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: linear-gradient(135deg, #ffffff 0%, #f9f9f9 100%);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            text-align: center;
            margin: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle background effect */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(100, 116, 139, 0.03) 0%, transparent 70%);
            animation: subtle-glow 20s ease-in-out infinite;
        }
        
        @keyframes subtle-glow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        .card-content {
            position: relative;
            z-index: 1;
        }
        
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 15px;
            object-fit: cover;
            border: 3px solid #cbd5e1;
            margin-bottom: 20px;
            padding: 2px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .profile-img:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }
        
        .name {
            font-size: 26px;
            color: #1e293b;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .title {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #475569;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid transparent;
        }
        
        .contact-item:hover {
            color: #1e40af;
            border: 1px solid rgba(30, 64, 175, 0.2);
            background: rgba(30, 64, 175, 0.05);
            transform: translateX(5px);
        }
        
        .contact-item i {
            width: 20px;
            color: #3b82f6;
            font-size: 16px;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .social-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #475569;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 18px;
            border: 1px solid #e2e8f0;
        }
        
        .social-btn:hover {
            background: #3b82f6;
            color: #ffffff;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
        }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
            margin: 25px 0;
        }
        
        .website-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #3b82f6;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .website-link:hover {
            background: #2563eb;
            border: 1px solid #2563eb;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
                max-width: 100%;
            }
            
            .name {
                font-size: 22px;
            }
            
            .profile-img {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-content">
            <!-- ပုံထည့်ရန်နေရာ -->
            <img src="/manus-storage/profile_fd8adf86.png" alt="Profile Picture" class="profile-img">
            
            <!-- နာမည်နှင့် ရာထူး -->
            <h1 class="name">Thet Htoo Swe</h1>
            <p class="title">{ Naoki }</p>
            
            <div class="divider"></div>
            
            <!-- ဖုန်းနှင့် အီးမေးလ် -->
            <div class="contact-info">
                <!-- အီးမေးလ် -->
                <a href="mailto:naokikun.ygn@gmail.com" class="contact-item">
                    <i class="fas fa-envelope"></i> naokikun.ygn@gmail.com
                </a>
                <!-- ဖုန်းနံပါတ် -->
                <a href="tel:+959755170040" class="contact-item">
                    <i class="fas fa-phone-alt"></i> +95 9755170040
                </a>
                <!-- Website -->
                <a href="https://naokikun.github.io" target="_blank" class="contact-item">
                    <i class="fas fa-globe"></i> naokikun.github.io
                </a>
            </div>

            <!-- Social Media လင့်ခ်များ -->
            <div class="social-links">
                <!-- GitHub Link -->
                <a href="https://github.com/NaokiKun" target="_blank" class="social-btn" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <!-- Telegram Link -->
                <a href="https://t.me/ismenaoki" target="_blank" class="social-btn" title="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>
                <!-- LinkedIn Link -->
                <a href="#" target="_blank" class="social-btn" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <!-- Facebook Link -->
                <a href="#" target="_blank" class="social-btn" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
            </div>
            
            <!-- Website Link Button -->
            <div>
                <a href="https://naokikun.github.io" target="_blank" class="website-link">
                    Visit Website
                </a>
            </div>
        </div>
    </div>

</body>
</html>
